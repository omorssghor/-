<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS গেট - ওমর এস এস ঘর</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #ddd;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 12px;
    }

    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      background: #ddd;
    }

    .details {
      background: white;
      margin: 10px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .details h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .details p {
      line-height: 1.7;
      font-size: 15px;
    }

    .details ul {
      padding-left: 20px;
      line-height: 1.8;
    }

    /* বড় ছবি দেখানোর জায়গা */
    .viewer {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }

    .viewer img {
      max-width: 92%;
      max-height: 82%;
      object-fit: contain;
      border-radius: 8px;
      user-select: none;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 20px;
      color: white;
      font-size: 35px;
      cursor: pointer;
      z-index: 10001;
    }

    .prev,
    .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 45px;
      cursor: pointer;
      padding: 15px;
      user-select: none;
    }

    .prev {
      left: 5px;
    }

    .next {
      right: 5px;
    }

    .counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      .gallery img {
        height: 180px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>ওমর এস এস ঘর</h1>
    <p>SS গেট ও গ্রিলের সুন্দর ডিজাইন</p>
  </div>

  <div class="gallery">

    <img src="images/ss-gate-1.jpg" alt="SS গেট"
         onclick="openViewer(0)">

    <img src="images/ss-gate-2.jpg" alt="SS গেট"
         onclick="openViewer(1)">

    <img src="images/ss-gate-3.jpg" alt="SS গেট"
         onclick="openViewer(2)">

    <img src="images/ss-gate-4.jpg" alt="SS গেট"
         onclick="openViewer(3)">

    <img src="images/ss-gate-5.jpg" alt="SS গেট"
         onclick="openViewer(4)">

    <img src="images/ss-gate-6.jpg" alt="SS গেট"
         onclick="openViewer(5)">

  </div>

  <div class="details">
    <h2>SS গেট</h2>

    <p>
      আপনার বাড়ির সৌন্দর্য ও নিরাপত্তার জন্য
      সুন্দর ডিজাইনের SS গেট তৈরি করা হয়।
    </p>

    <ul>
      <li>SS গেট</li>
      <li>SS গ্রিল</li>
      <li>SS দরজা</li>
      <li>বিভিন্ন ডিজাইনের কাজ</li>
      <li>মাপ অনুযায়ী তৈরি করা হয়</li>
    </ul>

    <p>
      📍 কলেজ বাজার পেট্রোল পাম্পের সামনে,
      বিরামপুর, দিনাজপুর।
    </p>
  </div>

  <!-- বড় ছবি দেখানোর অংশ -->

  <div class="viewer" id="viewer">

    <span class="close" onclick="closeViewer()">×</span>

    <span class="prev" onclick="previousImage()">‹</span>

    <img id="viewerImage" src="" alt="SS গেট">

    <span class="next" onclick="nextImage()">›</span>

    <div class="counter" id="counter"></div>

  </div>


  <script>

    const images = [
      "images/ss-gate-1.jpg",
      "images/ss-gate-2.jpg",
      "images/ss-gate-3.jpg",
      "images/ss-gate-4.jpg",
      "images/ss-gate-5.jpg",
      "images/ss-gate-6.jpg"
    ];

    let currentImage = 0;

    function openViewer(index) {
      currentImage = index;

      document.getElementById("viewer").style.display = "flex";

      showImage();

      document.body.style.overflow = "hidden";
    }

    function closeViewer() {
      document.getElementById("viewer").style.display = "none";

      document.body.style.overflow = "auto";
    }

    function showImage() {
      document.getElementById("viewerImage").src = images[currentImage];

      document.getElementById("counter").innerText =
        (currentImage + 1) + " / " + images.length;
    }

    function nextImage() {
      currentImage++;

      if (currentImage >= images.length) {
        currentImage = 0;
      }

      showImage();
    }

    function previousImage() {
      currentImage--;

      if (currentImage < 0) {
        currentImage = images.length - 1;
      }

      showImage();
    }


    /* মোবাইলে ডানে-বামে সোয়াইপ */

    let startX = 0;
    let endX = 0;

    const viewer = document.getElementById("viewer");

    viewer.addEventListener("touchstart", function(event) {
      startX = event.touches[0].clientX;
    });

    viewer.addEventListener("touchend", function(event) {

      endX = event.changedTouches[0].clientX;

      let difference = startX - endX;

      if (Math.abs(difference) > 50) {

        if (difference > 0) {
          nextImage();
        } else {
          previousImage();
        }

      }
    });


    /* কিবোর্ড দিয়েও ছবি বদলানো যাবে */

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {
        closeViewer();
      }

      if (event.key === "ArrowRight") {
        nextImage();
      }

      if (event.key === "ArrowLeft") {
        previousImage();
      }

    });

  </script>

</body>
</html>
